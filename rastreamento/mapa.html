<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa dos Motoristas</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>html,body,#mapa{height:100%;margin:0}</style>
</head>
<body>
<div id="mapa"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdn.firebase.com/libs/geofire/5.0.1/geofire.min.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyC4rG9xevBnnnD2C8yartqn1Jj80tK8HBM",
  authDomain: "rastreioguapiara.firebaseapp.com",
  databaseURL: "https://rastreioguapiara-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "rastreioguapiara",
  storageBucket: "rastreioguapiara.firebasestorage.app",
  messagingSenderId: "633809880923",
  appId: "1:633809880923:web:d4ee01c480ea60d93c3c7e"
});

const mapa = L.map('mapa').setView([-14.2, -51.9], 4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19}).addTo(mapa);

const marcadores = {};
let ajustou = false;

// raio de 20000 km = pega todos os pontos do geofire
const query = new GeoFire(firebase.database().ref('geofire')).query({center: [0, 0], radius: 20000});

// key = telefone do motorista (só dígitos)
function popup(tel, m) {
  const fone = tel.startsWith('55') ? tel : '55' + tel;
  const esc = s => String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  return `<b>${esc(m.nome) || 'Motorista'}</b> ${esc(m.placa)}<br>Tel: ${tel}` +
         (m.hora ? `<br>Atualizado: ${new Date(m.hora).toLocaleTimeString()}` : '') +
         `<br><a href="https://wa.me/${fone}" target="_blank">💬 WhatsApp</a> | <a href="sms:+${fone}">✉️ SMS</a>`;
}

query.on('key_entered', (key, loc) => {
  marcadores[key] = L.marker(loc).addTo(mapa).bindPopup(popup(key, {}));
  firebase.database().ref('motoristas/' + key).on('value', s => {
    if (marcadores[key]) marcadores[key].setPopupContent(popup(key, s.val() || {}));
  });
});
query.on('key_moved', (key, loc) => marcadores[key].setLatLng(loc));
query.on('key_exited', key => {
  firebase.database().ref('motoristas/' + key).off();
  mapa.removeLayer(marcadores[key]); delete marcadores[key];
});
query.on('ready', () => {
  const pts = Object.values(marcadores).map(m => m.getLatLng());
  if (pts.length && !ajustou) { mapa.fitBounds(L.latLngBounds(pts).pad(0.3), {maxZoom: 16}); ajustou = true; }
});
</script>
</body>
</html>
